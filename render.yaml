services:
  - type: web
    name: itselectric
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/me
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: itselectric-db
          property: connectionString
      # Set these in the Render dashboard (marked sync:false so they are not
      # stored in this file). See docs/deploy-render.md for how to mint the
      # refresh token.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      # Web-UI Google SSO (separate OAuth client from the Gmail one above).
      # Auth is enforced only when both the client id and the allowlist are set.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: ALLOWED_GOOGLE_EMAILS
        sync: false
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: itselectric-db
    plan: free
