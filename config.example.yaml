# Initial database configuration for itselectric-automation.
# Copy this file to config.yaml and fill in your values.
# config.yaml is gitignored — never commit it.
# Values seed the database on first startup; change them later in the web UI.

label: INBOX
max_messages: 100

# Optional Google Spreadsheet ID. Rows are exported after manual email sends.
spreadsheet_id: ""

# Optional HubSpot access token. When set, creates or updates contacts.
hubspot_access_token: ""

# Set true to send emails automatically during pipeline runs.
auto_send: false
